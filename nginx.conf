# Configuración de nginx para la imagen tuapo/tuapo-tesoro.
#
# Antes vivía en un `printf` gigante dentro del Dockerfile. Con la PWA hay
# archivos que NO se pueden cachear (el service worker y su manifiesto), y eso
# en una sola línea escapada era imposible de leer y de revisar.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # El HTML siempre fresco: es lo que ata la app a los bundles con hash.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires 0;
  }

  # ─── Service worker: NUNCA inmutable ────────────────────────────────────
  # Un ngsw-worker.js cacheado un año deja a la gente atrapada en la versión
  # que tenga instalada, sin forma de sacarla ni publicando uno nuevo. Las
  # locations `=` ganan a la regex de abajo, así que el orden da igual.
  location = /ngsw-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires 0;
  }

  location = /safety-worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires 0;
  }

  # ngsw.json es el inventario de versiones: si se cachea, el service worker
  # nunca se entera de que hay una versión nueva.
  location = /ngsw.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires 0;
  }

  # El manifiesto cambia poco pero debe poder cambiar: una hora, no un año.
  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600" always;
    types { } default_type application/manifest+json;
  }

  # Estáticos con hash en el nombre: cachear a un año es seguro por diseño.
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # ─── Enlaces públicos del módulo de turnos ─────────────────────────────
  # La app enruta por hash (#/) y el HTML se construye con base "./": abrir
  # /pantalla/X o /t/X sin el # hacía que el navegador pidiera los bundles en
  # /pantalla/main-XXX.js (404 por la regla de estáticos) y la página quedara
  # en blanco. Los QR impresos y los enlaces copiados siguen siendo "limpios";
  # aquí se les pone el # por ellos.
  location ~ ^/(pantalla|t)(/|$) {
    return 302 /#$uri$is_args$args;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

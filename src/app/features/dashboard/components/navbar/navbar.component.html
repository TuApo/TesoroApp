<aside id="app-sidebar" class="sidebar" [class.is-open]="!isSidebarHidden"
  [class.show-detail]="!!activeRoot && hasChildren(activeRoot)" [class.right-pinned]="pinOpen">

  <!-- PANEL IZQUIERDO -->
  <div class="left" (mouseleave)="scheduleClose($event)">

    <!-- BRAND -->
    <a class="sidebar-brand" routerLink="/dashboard" aria-label="Ir al inicio" (click)="isMobile && closeAll('api')">
      <img class="sidebar-brand__logo" src="logos/logo_alianza.svg" alt="Tu Apo" />
    </a>

    <!-- BOTONES DE MÓDULO -->
    <nav class="module-buttons" aria-label="Módulos principales">

      <!-- HOME fijo -->
      <button type="button" routerLink="/dashboard" routerLinkActive="active-module-button"
        [routerLinkActiveOptions]="{ exact: true }" aria-label="Inicio" title="Inicio"
        (click)="onRootClick(null)">
        <mat-icon fontSet="material-symbols-outlined">home</mat-icon>
        <span class="m-btn-label">Inicio</span>
      </button>

      <!-- Módulos raíz: el panel derecho se abre solo por click, NO por hover. -->
      @for (root of visibleRoots; track trackByNodeId($index, root)) {
        <button type="button" (click)="onRootClick(root)" [title]="root.nombre"
          [attr.aria-label]="root.nombre"
          [attr.aria-current]="isTreeActive(root) ? 'true' : null"
          [class.active-module-button]="activeRoot?.id === root.id || isTreeActive(root)"
          [attr.aria-expanded]="activeRoot?.id === root.id && hasChildren(root)"
          [attr.aria-controls]="activeRoot?.id === root.id && hasChildren(root) ? 'right-panel-content' : null">
          <mat-icon fontSet="material-symbols-outlined">
            {{ getModuleIcon(root) }}
          </mat-icon>
          <span class="m-btn-label">{{ root.nombre }}</span>
        </button>
      }
    </nav>

    <!-- BOTONES INFERIORES -->
    <div class="bottom-buttons">
      <!-- Configuración: ahora es un sub-módulo aquí (antes vivía en el engranaje del header). -->
      <button type="button" class="config-button" routerLink="/dashboard/configuracion"
        routerLinkActive="active-module-button"
        title="Configuración" aria-label="Configuración"
        (click)="isMobile && closeAll('api')">
        <mat-icon fontSet="material-symbols-outlined">settings</mat-icon>
        <span class="m-btn-label">Config</span>
      </button>
      <button type="button" class="logout-button" (click)="cerrarSesion()"
        title="Cerrar sesión" aria-label="Cerrar sesión">
        <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
        <span class="m-btn-label">Salir</span>
      </button>
    </div>
  </div>

  <!-- PANEL DERECHO (flyout / pinned) -->
  @if (!!activeRoot && hasChildren(activeRoot)) {
    <div
      class="right"
      [class.is-compact]="isMobile && isMobileCompact"
      id="right-panel-content"
      (mouseenter)="cancelClose()"
      (mouseleave)="scheduleClose($event)">
      <div class="right-inner">
        <!-- Cabecera -->
        <div class="header">
          <div class="header-left">
            <img
              class="header-logo"
              src="logos/logo_alianza.svg"
              alt="Tu Apo" />
              <div class="header-texts">
                <span class="header-brand">Tu Apo</span>
                <h2 class="header-title">{{ activeRoot!.nombre }}</h2>
              </div>
            </div>
            <!-- En desktop: botón pin. En mobile: oculto (tira siempre compacta). -->
            @if (!isMobile) {
              <button
                class="header-pin-button"
                [title]="pinOpen ? 'Colapsar' : 'Expandir'"
                type="button"
                (click)="togglePin()">
                <mat-icon fontSet="material-symbols-outlined" class="header-icon">
                  {{ pinOpen ? 'expand_less' : 'expand_more' }}
                </mat-icon>
              </button>
            }
          </div>
          <!-- Árbol de sub-módulos (scrollable) -->
          <nav [attr.aria-label]="'Submódulos de ' + activeRoot!.nombre">
            <ng-template #tree let-nodes="nodes" let-level="level">
              @for (node of nodes; track trackByNodeId($index, node)) {
                <div class="tree-wrap" [style.paddingLeft.px]="(level - 2) * 14">
                  <button type="button" class="submodule-button" (click)="onNodeClick(node)"
                    [attr.aria-expanded]="hasChildren(node) ? isExpanded(node.id) : null"
                    [class.active-submodule]="(!hasChildren(node) || hasOwnScreen(node)) && isRouteActive(getNodeRoute(node))">
                    <mat-icon fontSet="material-symbols-outlined">
                      {{ hasChildren(node) ? 'folder' : getNodeIcon(node) }}
                    </mat-icon>
                    <span class="submodule-text">{{ node.nombre }}</span>
                    @if (hasChildren(node)) {
                      <mat-icon fontSet="material-symbols-outlined" class="expand-icon">
                        {{ isExpanded(node.id) ? 'expand_less' : 'expand_more' }}
                      </mat-icon>
                    }
                  </button>
                  @if (hasChildren(node) && isExpanded(node.id)) {
                    <ng-container *ngTemplateOutlet="tree; context: { nodes: node.hijos || [], level: level + 1 }">
                    </ng-container>
                  }
                </div>
              }
            </ng-template>
            <ng-container *ngTemplateOutlet="tree; context: { nodes: activeRoot!.hijos || [], level: 2 }">
            </ng-container>
          </nav>
        </div>
      </div>
    }
  </aside>

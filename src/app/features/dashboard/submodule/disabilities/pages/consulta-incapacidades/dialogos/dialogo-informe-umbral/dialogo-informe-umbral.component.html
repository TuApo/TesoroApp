<div class="umb-hero">
  <div class="umb-hero-icono">
    <mat-icon>timelapse</mat-icon>
  </div>

  <div class="umb-hero-textos">
    <h2 class="umb-hero-titulo" mat-dialog-title>Umbrales de 180 y 540 días</h2>
    <p class="umb-hero-sub">
      Quién está incapacitado hoy, cuándo pasa cada persona al fondo de pensiones (día 181) y
      cuándo vuelve a la EPS (día 541)
    </p>
  </div>

  <button
    type="button"
    mat-icon-button
    class="umb-cerrar"
    (click)="cerrar()"
    aria-label="Cerrar"
    matTooltip="Cerrar"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="umb-cuerpo">
  <app-panel-umbrales />
</mat-dialog-content>

<mat-dialog-actions class="umb-acciones">
  <span class="umb-pista">
    <mat-icon>download</mat-icon>
    Para llevarlo a Excel usa el botón de descarga de la tabla: baja lo que estés viendo.
  </span>
  <span class="umb-espaciador"></span>
  <button type="button" mat-stroked-button (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>

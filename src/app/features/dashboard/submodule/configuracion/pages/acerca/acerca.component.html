<div class="cfg-card about">
  <div class="about__brand">
    <img class="about__logo" src="logos/logo_alianza.svg" alt="Tu Apo" />
  </div>

  <div class="about__version">
    <span class="about__v">v{{ version }}</span>
    <span class="about__platform" [attr.data-key]="platform.key">
      <mat-icon fontSet="material-symbols-outlined">{{ platform.icon }}</mat-icon>
      {{ platform.label }}
    </span>
  </div>
  <p class="about__tagline">Gestión Tesorería · Tu Apo</p>
</div>

<div class="cfg-card">
  <div class="cfg-card__head">
    <h2 class="cfg-card__title">Detalles</h2>
    <p class="cfg-card__hint">Información de esta instalación.</p>
  </div>

  <dl class="field-list">
    <div class="field">
      <dt class="field__label"><mat-icon fontSet="material-symbols-outlined">{{ platform.icon }}</mat-icon> Dispositivo</dt>
      <dd class="field__value">{{ platform.label }}</dd>
    </div>
    <div class="field">
      <dt class="field__label"><mat-icon fontSet="material-symbols-outlined">sell</mat-icon> Versión</dt>
      <dd class="field__value">{{ version }}</dd>
    </div>
    <div class="field">
      <dt class="field__label"><mat-icon fontSet="material-symbols-outlined">dns</mat-icon> Servidor</dt>
      <dd class="field__value">{{ servidor || '—' }}</dd>
    </div>
  </dl>
</div>

<input type="file" id="fileInput" (change)="cargarExcel($event)" accept=".xlsx, .xls" style="display: none;">
<input type="file" id="fileInputEmails" (change)="cargarCorreosMasivos($event)" accept=".xlsx, .xls"
  style="display: none;">

  <mat-card class="premium-card">
    <mat-card-header class="card-header-premium">
      <div class="header-content">
        <div class="header-icon-container">
          <mat-icon class="header-icon">request_quote</mat-icon>
        </div>
        <div class="header-text">
          <mat-card-title class="titulo">Desprendibles de Pago</mat-card-title>
          <mat-card-subtitle class="subtitulo">Consulte y administre los comprobantes de nómina.</mat-card-subtitle>
        </div>
      </div>

      <button mat-icon-button class="header-menu-btn" [matMenuTriggerFor]="accionesMenu"
        matTooltip="Más acciones" aria-label="Más acciones">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #accionesMenu="matMenu" xPosition="before">
        @if (puedeGestionarDesprendibles) {
          <button mat-menu-item (click)="descargarPlantillaDesprendibles()">
            <mat-icon>download</mat-icon>
            <span>Descargar plantilla desprendibles</span>
          </button>
          <button mat-menu-item (click)="triggerFileInput('desprendibles')">
            <mat-icon>upload_file</mat-icon>
            <span>Cargar desprendibles de pago</span>
          </button>
          <mat-divider></mat-divider>
        }
        <button mat-menu-item (click)="descargarPlantillaCorreos()">
          <mat-icon>download</mat-icon>
          <span>Descargar plantilla correos</span>
        </button>
        <button mat-menu-item (click)="triggerFileInput('correos')">
          <mat-icon>mark_email_read</mat-icon>
          <span>Cambiar masivamente los correos</span>
        </button>
      </mat-menu>
    </mat-card-header>
    <mat-card-content class="card-content">

      <div class="search-container">
        <div class="buscar">
          <mat-form-field appearance="fill" class="example-full-width">
            <mat-label>Ingrese la cédula</mat-label>
            <input matInput [(ngModel)]="cedula" (keyup.enter)="buscarDesprendibles(cedula)">
          </mat-form-field>
          <button mat-flat-button (click)="buscarDesprendibles(cedula)" class="boton btn-managerial">
            <mat-icon>search</mat-icon>
            Buscar
          </button>
        </div>
      </div>

      <div class="tabla">
        <app-standard-filter-table [data]="dataList" [columnDefinitions]="columns" [tableTitle]="'Desprendibles de pago'"
          [enableRowClick]="false">

          <ng-template #estadoTemplate let-row let-col="col">
            <!-- Si la quincena ya se migró con la carga por carpeta, manda el
                 documento interno: está en la plataforma, no depende de que
                 alguien conserve permisos en Drive. -->
            @if (documentoInterno(row, col.name); as doc) {
              <button type="button" class="btn-doc-interno"
                      (click)="abrirDocumentoInterno(doc)"
                      [title]="doc.nombre_archivo || 'Documento interno'">
                Ver documento
              </button>
            } @else if (isValidLink(row[col.name])) {
              <!-- Respaldo del histórico: ~997k filas antiguas solo tienen el
                   enlace de Drive y no se van a migrar. -->
              <a [href]="row[col.name]" target="_blank" rel="noopener" class="link-style"
                 title="Enlace antiguo de Drive (no está en la plataforma)">
                Ver link
              </a>
            } @else {
              <span>
                {{ row[col.name] || '-' }}
              </span>
            }
          </ng-template>

        </app-standard-filter-table>
      </div>
    </mat-card-content>
  </mat-card>

<section class="pantalla">
  <header class="cabecera">
    <div>
      <h1>Catálogo de cursos</h1>
      <p class="subtitulo">Define qué formación existe. El contenido de cada curso se arma dentro.</p>
    </div>
    <button type="button" class="btn-primario" (click)="nuevo()">
      <mat-icon>add</mat-icon> Nuevo curso
    </button>
  </header>

  @if (editando(); as form) {
    <div class="panel">
      <h2>{{ form.id ? 'Editar curso' : 'Nuevo curso' }}</h2>

      <div class="campos">
        <label>
          <span>Nombre del curso *</span>
          <input type="text" [(ngModel)]="form.nombre" placeholder="Ej: Trabajo seguro en alturas" />
        </label>

        <label>
          <span>Código</span>
          <input type="text" [(ngModel)]="form.codigo" placeholder="Se genera del nombre si lo dejas vacío" />
          <small>Identifica el curso en reportes y en el importador del histórico.</small>
        </label>

        <label class="ancho-completo">
          <span>Descripción</span>
          <textarea rows="2" [(ngModel)]="form.descripcion"
                    placeholder="De qué trata y a quién va dirigido"></textarea>
        </label>

        <label>
          <span>Modalidad</span>
          <select [(ngModel)]="form.modalidad_default">
            <option value="AUTOGESTIONADO">Autogestionado (a su ritmo)</option>
            <option value="VIRTUAL_SINCRONICO">Virtual con horario</option>
            <option value="PRESENCIAL">Presencial</option>
          </select>
        </label>

        <label>
          <span>Vigencia en meses</span>
          <input type="number" min="1" [(ngModel)]="form.vigencia_meses" placeholder="Vacío = no vence" />
          <small>Cada cuánto hay que recertificar. Dispara los avisos de vencimiento.</small>
        </label>

        <label>
          <span>Entidad capacitadora</span>
          <input type="text" [(ngModel)]="form.entidad_capacitadora" />
          <small>Sale impresa en el certificado.</small>
        </label>

        <label class="checkbox">
          <input type="checkbox" [(ngModel)]="form.obligatorio" />
          <span>Es formación obligatoria</span>
        </label>
      </div>

      <div class="acciones-panel">
        <button type="button" class="btn-secundario" (click)="cerrar()">Cancelar</button>
        <button type="button" class="btn-primario" [disabled]="guardando()" (click)="guardar()">
          {{ guardando() ? 'Guardando…' : (form.id ? 'Guardar cambios' : 'Crear y armar contenido') }}
        </button>
      </div>
    </div>
  }

  @if (error()) {
    <div class="aviso-error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error() }}</span>
      <button type="button" class="btn-primario" (click)="cargar()">Reintentar</button>
    </div>
  } @else {
    <!-- «Ver» y el doble clic abren el contenido del curso (antes: el nombre y «Armar contenido»). -->
    <app-tabla-estandar
      id="capacitaciones-catalogo-cursos"
      titulo="Catálogo de cursos"
      modulo="Capacitaciones"
      busqueda="Buscar por nombre o código"
      vacio="Todavía no hay cursos."
      [datos]="cursos()"
      [columnas]="columnas"
      [filaId]="idCurso"
      [cargando]="cargando()"
      (filaClick)="abrir($event)">

      <ng-template tablaCelda="curso" let-c>
        {{ c.nombre }}
        @if (c.obligatorio) { <span class="chip chip-obligatorio">Obligatorio</span> }
      </ng-template>

      <ng-template tablaCelda="codigo" let-c>
        <span class="mono">{{ c.codigo }}</span>
      </ng-template>

      <ng-template tablaAcciones let-c>
        <button type="button" class="btn-icono" title="Editar datos" (click)="editar(c)">
          <mat-icon>edit</mat-icon>
        </button>
        <button type="button" class="btn-icono peligro" title="Archivar" (click)="archivar(c)">
          <mat-icon>inventory_2</mat-icon>
        </button>
      </ng-template>
    </app-tabla-estandar>
  }
</section>

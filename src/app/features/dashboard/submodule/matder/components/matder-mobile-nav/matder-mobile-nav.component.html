<nav class="mobile-nav">
  @for (item of items; track item.path) {
    <button class="nav-item" [class.active]="isActive(item.path)"
            (click)="go(item.path)" matRipple [matRippleCentered]="true">
      <mat-icon>{{ item.icon }}</mat-icon>
      <span>{{ item.label }}</span>
    </button>
  }
</nav>

<h1 mat-dialog-title>Detalles de adres</h1>
<div mat-dialog-content>
  <app-tabla-estandar
    id="traslados-adres"
    titulo="Detalles de ADRES"
    modulo="Traslados EPS"
    [datos]="data"
    [columnas]="columnas">

    <ng-template tablaCelda="pdf_documento" let-e>
      <a [href]="e.pdf_documento" target="_blank">Ver Documento</a>
    </ng-template>
  </app-tabla-estandar>
</div>
<div mat-dialog-actions>
  <button mat-button mat-dialog-close>Cerrar</button>
</div>

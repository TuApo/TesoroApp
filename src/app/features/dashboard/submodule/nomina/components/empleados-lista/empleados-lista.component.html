<div class="emp-list">

  <!-- Toolbar de filtros -->
  <div class="emp-toolbar">
    <mat-form-field appearance="outline" class="emp-toolbar__field">
      <mat-label>Cliente</mat-label>
      <mat-select [ngModel]="clienteId()" (ngModelChange)="onClienteChange($event)">
        <mat-option [value]="null">Todos</mat-option>
        @for (c of clientes(); track c.id_entidad) {
          <mat-option [value]="c.id_entidad">{{ c.nombre_legal }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="emp-toolbar__field">
      <mat-label>Centro de Costo</mat-label>
      <mat-select [ngModel]="cecoId()" (ngModelChange)="onCecoChange($event)" [disabled]="!clienteId()">
        <mat-option [value]="null">Todos</mat-option>
        @for (c of cecos(); track c.id_ceco) {
          <mat-option [value]="c.id_ceco">{{ c.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="emp-toolbar__field emp-toolbar__field--sm">
      <mat-label>Estado</mat-label>
      <mat-select [ngModel]="estado()" (ngModelChange)="onEstadoChange($event)">
        <mat-option value="ACTIVO">Activo</mat-option>
        <mat-option value="INACTIVO">Inactivo</mat-option>
        <mat-option value="RETIRADO">Retirado</mat-option>
        <mat-option value="FINALIZADO">Finalizado</mat-option>
        <mat-option value="">Todos</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-stroked-button (click)="limpiarFiltros()" matTooltip="Limpiar filtros">
      <mat-icon>filter_alt_off</mat-icon>
    </button>

    <div class="emp-toolbar__spacer"></div>

    <button mat-flat-button color="primary" (click)="abrirEditor()">
      <mat-icon>person_add</mat-icon> Nuevo empleado
    </button>
  </div>

  <!-- Tabla (modo servidor: el backend pagina y hace la búsqueda libre) -->
  <div class="emp-table-wrap">
    <app-tabla-estandar
      id="nomina-empleados"
      titulo="Empleados"
      modulo="Nómina"
      entidad="empleados"
      busqueda="Buscar (nombre o documento)…"
      vacio="No se encontraron empleados con los filtros actuales."
      [datos]="empleados()"
      [columnas]="columnas"
      [filaId]="idEmpleado"
      [cargando]="loading()"
      [totalServidor]="total()"
      [filasPorPagina]="pageSize()"
      (paginaCambio)="onPage($event)"
      (busquedaCambio)="onBuscar($event)"
      (filaClick)="abrirEditor($event)">

      <ng-template tablaCelda="documento" let-e>
        <span class="cell-strong">{{ tipoDoc(e) }} {{ e.numero_documento }}</span>
      </ng-template>

      <ng-template tablaAcciones let-e>
        <button mat-icon-button color="primary" (click)="abrirEditor(e); $event.stopPropagation()" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(e, $event)" matTooltip="Retirar">
          <mat-icon>person_off</mat-icon>
        </button>
      </ng-template>
    </app-tabla-estandar>
  </div>

</div>

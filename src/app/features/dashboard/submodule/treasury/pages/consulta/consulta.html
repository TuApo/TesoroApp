<div class="tsr-pagina">
  <header class="tsr-cabecera">
    <div>
      <h1>Consulta de persona</h1>
      <p>
        Busca por cédula, nombre o código de contrato. Verás su cupo, de dónde sale el
        tope, qué ha solicitado y el estado de cada condición antes de autorizar.
      </p>
    </div>
  </header>

  <div class="tsr-tarjeta buscador-tarjeta">
    <app-buscador-persona (seleccionada)="alSeleccionar($event)" />
  </div>

  <app-ficha-persona [documento]="documento()" [sede]="sede()" />
</div>

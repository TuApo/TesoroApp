<mat-card class="premium-card">
  <mat-card-header class="card-header-premium">
    <div class="header-content">
      <div class="header-icon-container">
        <mat-icon class="header-icon">work</mat-icon>
      </div>
      <div class="header-text">
        <mat-card-title class="titulo">Gestión de Cargos</mat-card-title>
        <mat-card-subtitle class="subtitulo">Administre el catálogo de puestos de trabajo corporativos.</mat-card-subtitle>
      </div>
    </div>

    <span class="grow"></span>

    <div class="header-actions">
      <!-- La acción primaria va visible. Antes vivía escondida dentro del menú
           de 3 puntos, al mismo nivel que Importar y Exportar. -->
      <button mat-flat-button class="btn-managerial" (click)="nuevo()">
        <mat-icon>add</mat-icon> Nuevo cargo
      </button>

      <!-- El menú queda solo para lo secundario -->
      <button mat-icon-button class="btn-managerial-icon" [matMenuTriggerFor]="mainMenu"
        matTooltip="Más acciones" aria-label="Más acciones">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #mainMenu="matMenu">
        <button mat-menu-item (click)="triggerImport()">
          <mat-icon>file_upload</mat-icon>
          <span>Importar desde Excel</span>
        </button>
        <button mat-menu-item (click)="exportar()">
          <mat-icon>file_download</mat-icon>
          <span>Exportar a Excel</span>
        </button>
      </mat-menu>
    </div>

    <!-- Input para importar (oculto) -->
    <input #fileInp type="file" accept=".xlsx,.xls" (change)="onImportFile($event)" hidden>
  </mat-card-header>

  <mat-card-content class="card-body">
    <app-standard-filter-table [data]="viewData" [columnDefinitions]="columns" [pageSizeOptions]="[10,20,50]"
      [defaultPageSize]="10" [tableTitle]="'Cargos'" [isLoading]="loading">

      <!-- Acciones por fila -->
      <ng-template #actionsTemplate let-row>
        <button mat-icon-button [matMenuTriggerFor]="rowMenu" matTooltip="Acciones" aria-label="Acciones de fila">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #rowMenu="matMenu">
          <button mat-menu-item (click)="editar(row)">
            <mat-icon>edit</mat-icon>
            <span>Editar</span>
          </button>
          <!-- Destructivo: se marca con clase propia, no con color="warn"
               (que pinta el rojo de Material, ajeno a la paleta). -->
          <button mat-menu-item class="menu-item-danger" (click)="eliminar(row)">
            <mat-icon>delete</mat-icon>
            <span>Eliminar</span>
          </button>
        </mat-menu>
      </ng-template>
    </app-standard-filter-table>
  </mat-card-content>
</mat-card>

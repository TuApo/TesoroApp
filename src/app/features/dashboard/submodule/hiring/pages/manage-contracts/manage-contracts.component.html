<div class="page-container">
  <div class="header-section">
    <h1>Gestión de Contratos</h1>
    <p>Visualice los candidatos con contrato activo y realice bajas masivas según fecha límite.</p>
  </div>

  <mat-card class="content-card">
    <mat-card-content class="card-content-flex">

      <!-- La búsqueda la trae la tabla estándar; aquí queda la acción masiva. -->
      <div class="toolbar">
        <button mat-flat-button color="warn" (click)="darBajaMasiva()" [disabled]="selection.selected.length === 0" class="baja-masiva-btn">
          <mat-icon>block</mat-icon>
          Dar de Baja Seleccionados ({{selection.selected.length}})
        </button>
      </div>

      <div class="table-container">
        <app-tabla-estandar
          id="contratacion-gestion-contratos"
          titulo="Contratos activos"
          modulo="Contratación"
          busqueda="Cédula, nombres, oficina, centro de costo…"
          vacio="No se encontraron contratos activos."
          [datos]="dataSource()"
          [columnas]="columnas"
          [filaId]="idFila"
          [seleccion]="selection"
          [cargando]="loading()">

          <ng-template tablaCelda="nombres" let-element>
            <strong>{{element.nombres}} {{element.apellidos}}</strong>
          </ng-template>

          <ng-template tablaCelda="oficina" let-element>
            <span class="chip-oficina">{{element.oficina}}</span>
          </ng-template>
        </app-tabla-estandar>
      </div>

    </mat-card-content>
  </mat-card>
</div>

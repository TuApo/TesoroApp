<mat-card class="premium-card">
  <mat-card-header class="card-header-premium">
    <div class="header-content">
      <div class="header-icon-container">
        <mat-icon class="header-icon">contact_page</mat-icon>
      </div>
      <div class="header-text">
        <mat-card-title class="titulo">Consulta de Formularios</mat-card-title>
        <mat-card-subtitle class="subtitulo">Búsqueda de registros detallados por cédula.</mat-card-subtitle>
      </div>
    </div>
  </mat-card-header>
  <mat-card-content class="card-content">

    <!-- Campo de entrada para filtrar por cédula -->
    <mat-form-field class="example-full-width">
      <mat-label>Buscar por Cédula</mat-label>
      <input matInput (input)="onCedulaInput($event)" placeholder="Ingrese número de cédula">
    </mat-form-field>


    <!-- Botón para buscar por cédula -->
    <button mat-flat-button class="btn-managerial" style="margin-left: 20px; margin-right: 20px;" (click)="buscarPorCedula()">
      <mat-icon>search</mat-icon> Buscar
    </button>

    <!-- Botón para copiar tabla -->
    <button mat-raised-button color="primary" (click)="copyTableToClipboard()">
      <mat-icon>content_copy</mat-icon> Copiar Tabla
    </button>

    <!-- Resultados en la tabla estándar. «Copiar Tabla» (arriba) sigue copiando
         en el orden de la plantilla de Excel, con sus columnas vacías. -->
    <div class="table-container">
      <app-tabla-estandar
        id="contratacion-consulta-formularios"
        titulo="Consulta de formularios"
        modulo="Contratación"
        vacio="Busque una cédula para ver sus formularios."
        [datos]="filas()"
        [columnas]="columnas">
      </app-tabla-estandar>
    </div>

  </mat-card-content>
</mat-card>

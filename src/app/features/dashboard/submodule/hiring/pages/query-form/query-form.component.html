<mat-card class="premium-card">
  <mat-card-header class="card-header-premium">
    <div class="header-content">
      <div class="header-icon-container">
        <mat-icon class="header-icon">contact_page</mat-icon>
      </div>
      <div class="header-text">
        <mat-card-title class="titulo">Consulta de Formularios</mat-card-title>
        <mat-card-subtitle class="subtitulo">Búsqueda de registros detallados por cédula o nombre.</mat-card-subtitle>
      </div>
    </div>
  </mat-card-header>
  <mat-card-content class="card-content">

    <!-- El buscador de la tabla sugiere candidatos (cédula o nombre) mientras se
         escribe; al elegir uno reemplaza lo mostrado, salvo las filas marcadas.
         Pegar varias cédulas (Ctrl+V en el buscador o el botón «Pegar cédulas»)
         las trae todas de una vez. El «Pegar lista» de la tabla se apaga: solo
         marca filas ya cargadas y aquí la tabla empieza vacía. -->
    <div class="table-container" (paste)="alPegar($event)">
      <app-tabla-estandar
        id="contratacion-consulta-formularios"
        titulo="Consulta de formularios"
        modulo="Contratación"
        busqueda="Buscar por cédula o nombre…"
        vacio="Escriba una cédula o un nombre en el buscador y elija de la lista, o pegue varias cédulas."
        [datos]="filas()"
        [columnas]="columnas"
        [cargando]="cargando()"
        [seleccion]="seleccion"
        [pegable]="false"
        [sugerencias]="sugerencias()"
        (busquedaCambio)="pedirSugerencias($event)"
        (sugerenciaElegida)="agregar($event.id)">
        <button tablaAccionesBarra mat-stroked-button type="button" (click)="pegarCedulas()"
                [disabled]="cargando()" title="Pegar varias cédulas (una columna de Excel) y traer sus formularios">
          <mat-icon>content_paste_search</mat-icon> Pegar cédulas
        </button>
      </app-tabla-estandar>
    </div>

  </mat-card-content>
</mat-card>

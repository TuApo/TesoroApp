<div class="preview-container">
  <div class="preview-header">
    <h3 class="preview-title">
      <mat-icon>preview</mat-icon>
      Vista Previa: Cédulas
    </h3>
    <div class="counters">
      <div class="counter total">
        <span class="label">Total</span>
        <span class="value">{{ totalItems }}</span>
      </div>
      <div class="counter valid">
        <span class="label">Válidos</span>
        <span class="value">{{ validItems }}</span>
      </div>
      @if (invalidItems > 0) {
        <div class="counter invalid">
          <span class="label">Errores</span>
          <span class="value">{{ invalidItems }}</span>
        </div>
      }
    </div>
  </div>

  <!-- La tabla estándar trae la vista en tarjetas para móvil: ya no hay vista móvil propia. -->
  <div class="preview-body">
    <app-tabla-estandar
      id="contratacion-reporte-previa-cedulas"
      titulo="Vista previa cédulas"
      modulo="Contratación"
      [datos]="data"
      [columnas]="columnas"
      [filaClase]="claseFila">

      <ng-template tablaCelda="status" let-element>
        <mat-icon [class.valid-icon]="element.esValido" [class.invalid-icon]="!element.esValido"
          [matTooltip]="element.esValido ? 'Correcto' : element.error">
          {{ element.esValido ? 'check_circle' : 'cancel' }}
        </mat-icon>
      </ng-template>

      <ng-template tablaCelda="archivo" let-element>
        <span class="filename" [matTooltip]="element.nombreArchivo">{{ element.nombreArchivo }}</span>
      </ng-template>

      <ng-template tablaVacio>
        <div class="empty-state">
          <mat-icon>upload_file</mat-icon>
          <p>Selecciona archivos para ver la vista previa.</p>
        </div>
      </ng-template>
    </app-tabla-estandar>
  </div>

</div>

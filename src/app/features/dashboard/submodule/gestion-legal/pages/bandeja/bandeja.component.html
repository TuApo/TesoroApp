<div class="bandeja-container">
  <!-- Encabezado -->
  <div class="bandeja-header">
    <div class="header-title">
      <mat-icon class="header-icon">gavel</mat-icon>
      <div>
        <h1>Gestión de Procesos Legales</h1>
        <p>Bandeja de procesos laborales activos</p>
      </div>
    </div>
    <div class="header-actions">
      <button mat-flat-button color="primary" class="fab-nuevo" (click)="nuevoProceso()">
        <mat-icon>add</mat-icon>
        Nuevo Proceso
      </button>
    </div>
  </div>

  <!-- Filtros de negocio: tipo y estado van al backend; la búsqueda por texto
       (también en el backend) y la paginación las da la tabla estándar. -->
  <div class="filtros-bar">
    <mat-form-field appearance="outline" class="filtro-field">
      <mat-label>Tipo de proceso</mat-label>
      <mat-select [formControl]="filtroTipo" (selectionChange)="aplicarFiltros()">
        <mat-option [value]="null">Todos</mat-option>
        <mat-option *ngFor="let t of tipos" [value]="t.id">{{ t.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filtro-field">
      <mat-label>Estado</mat-label>
      <mat-select [formControl]="filtroEstado" (selectionChange)="aplicarFiltros()">
        <mat-option [value]="null">Todos</mat-option>
        <mat-option *ngFor="let e of estados" [value]="e.id">{{ e.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filtro-field filtro-semaforo">
      <mat-label>Semáforo</mat-label>
      <mat-select [formControl]="filtroSemaforo" (selectionChange)="cargar()">
        <mat-option value="">Todos</mat-option>
        <mat-option value="verde">🟢 Al día</mat-option>
        <mat-option value="amarillo">🟡 Por vencer</mat-option>
        <mat-option value="rojo">🔴 Urgente</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-stroked-button (click)="limpiarFiltros()" matTooltip="Limpiar filtros">
      <mat-icon>filter_alt_off</mat-icon>
    </button>
  </div>

  <!-- Tabla estándar en modo servidor: el backend pagina y busca (`q`). -->
  <app-tabla-estandar
    id="legal-bandeja-procesos"
    titulo="Procesos legales"
    modulo="Gestión legal"
    entidad="procesos_legales"
    busqueda="Buscar radicado, trabajador…"
    vacio="No hay procesos que coincidan con los filtros"
    textoDetalle="Expediente"
    [datos]="procesos"
    [columnas]="columnas"
    [filaId]="idProceso"
    [cargando]="cargando"
    [totalServidor]="totalElements"
    [filasPorPagina]="pageSize"
    (paginaCambio)="onPageChange($event)"
    (busquedaCambio)="buscar($event)"
    (filaClick)="irExpediente($event)">

    <ng-template tablaCelda="radicado" let-p>
      <span class="radicado-badge">{{ p.radicado }}</span>
    </ng-template>

    <ng-template tablaCelda="tipo" let-p>
      <span class="tipo-chip" [style.background]="p.tipoColorHex + '22'" [style.color]="p.tipoColorHex">
        {{ p.tipo_nombre }}
      </span>
    </ng-template>

    <ng-template tablaCelda="trabajador" let-p>
      <span class="trabajador-nombre">{{ p.trabajador_nombre }}</span>
    </ng-template>

    <ng-template tablaCelda="estado" let-p>
      <span class="estado-chip" [ngClass]="colorSemaforoClass(p.color_semaforo)"
        [matTooltip]="colorSemaforoLabel(p.color_semaforo)">
        {{ p.estado_nombre }}
      </span>
    </ng-template>

    <ng-template tablaAcciones let-p>
      <button mat-icon-button (click)="abrirCambiarEstado(p, $event)" matTooltip="Cambiar estado">
        <mat-icon>swap_horiz</mat-icon>
      </button>
    </ng-template>
  </app-tabla-estandar>
</div>
